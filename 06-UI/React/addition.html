<!DOCTYPE html>
<html lang="en">
    <head>
        <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
        <title>Hello</title>
        <style>
            #app {
                text-align: center;
                font-family: sans-serif;
            }

            #problem {
                font-size: 72px;
            }

            #winner {
                font-size: 72px;
                color: green;
            }

            .incorrectColor {
                color: red;
            }

            .correctColor {
                color: green;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>

        <script type="text/babel"> // I need to run it through babel, because I write JSX
            function App() { // creating the react component
                const [state, setState] = React.useState({
                    num1: 1,
                    num2: 1,
                    response: "",
                    score: 0,
                    incorrect: false
                });

                function updateResponse(event) {
                    setState({
                        ...state, // the state is the same that it was
                        response: event.target.value // except the new value, set here
                    });
                };

                function inputKeyPress(event) {
                    if (event.key === "Enter") {
                        const answer = parseInt(state.response); // parseInt turns string into int if possible
                        if (answer === state.num1 + state.num2) {
                            // User got question right
                            setState({
                                ...state,
                                score: state.score + 1,
                                response: "",
                                num1: Math.ceil(Math.random() * 10),
                                num2: Math.ceil(Math.random() * 10),
                                incorrect: false
                            });

                        } else {
                            // User got question wrong
                            setState({
                                ...state,
                                score: state.score - 1,
                                response: "",
                                incorrect: true
                            })
                        }
                    }
                }

                if (state.score === 10) {
                    return (
                        <div id="winner">You won!</div>
                    );
                } else {
                    return (
                        <div>
                            <div id="problem">{state.num1} + {state.num2}</div>
                            <input onChange={updateResponse} onKeyPress={inputKeyPress} value={state.response} autoFocus={true}/>
                            <div className={state.incorrect ? "incorrectColor" : "correctColor"}>Score: {state.score}</div>
                        </div>
                    );
                }
            }

            ReactDOM.render(<App />, document.querySelector("#app")); // render the App, within the #app div
        </script>
    </body>
</html>
