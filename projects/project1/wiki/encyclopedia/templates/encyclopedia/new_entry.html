{% extends "encyclopedia/layout.html" %}

{% block title %}
    Encyclopedia
{% endblock %}

{% block body %}
    <h1>Create New Page</h1>
    <form action="{% url 'encyclopedia:new_entry' %}" method="POST">
        {% csrf_token %}
        <input type="text" name="title" placeholder="Enter a title" autofocus>
        <br/>
        <textarea name="content" placeholder="Enter markdown content"></textarea>
        <br/>
        <input type="submit" value="Save page">
    </form>

{% endblock %}
