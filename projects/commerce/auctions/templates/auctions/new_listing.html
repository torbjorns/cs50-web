{% extends "auctions/layout.html" %}

{% block body %}

    <h2>Create New Listing</h2>

    {% if message %}
        <div>{{ message }}</div>
    {% endif %}

    <form action="{% url 'new_listing' %}" method="post">
        {% csrf_token %}
        <table>
            {{ form.as_table }}
        </table>
        
        <input class="btn btn-primary" type="submit" value="Post item">
    </form>

    <a href="{% url 'index' %}">Back to all listings.</a>

{% endblock %}
